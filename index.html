<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Histórias Proibidas — Prévia Gratuita 🔞</title>

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '25817864254464973');
    fbq('track', 'PageView');
    fbq('track', 'ViewContent');
  </script>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=25817864254464973&ev=PageView&noscript=1"/></noscript>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #080005;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ---- TOP BAR ---- */
    .topbar {
      width: 100%;
      background: rgba(0,0,0,0.6);
      border-bottom: 1px solid rgba(200,0,60,0.2);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .topbar-title {
      font-size: 13px;
      font-weight: 700;
      color: #ff4466;
      letter-spacing: 0.5px;
    }

    .topbar-badge {
      font-size: 10px;
      background: rgba(200,0,60,0.15);
      border: 1px solid rgba(200,0,60,0.35);
      color: #ff6688;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    /* ---- PAGE COUNTER ---- */
    .page-counter {
      font-size: 12px;
      color: #604050;
      margin: 14px 0 8px;
      letter-spacing: 1px;
    }

    .page-counter span {
      color: #ff4466;
      font-weight: 700;
    }

    /* ---- READER ---- */
    .reader {
      width: 100%;
      max-width: 480px;
      padding: 0 12px;
      perspective: 1200px;
    }

    /* Page flip container */
    .page-scene {
      position: relative;
      width: 100%;
    }

    .page-scene img {
      width: 100%;
      border-radius: 6px;
      display: block;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 2px 8px rgba(200,0,60,0.15);
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Flip animation */
    .page-flip-out {
      animation: flipOut 0.35s ease-in forwards;
      transform-origin: left center;
    }
    .page-flip-in {
      animation: flipIn 0.35s ease-out forwards;
      transform-origin: left center;
    }
    .page-flip-out-prev {
      animation: flipOutPrev 0.35s ease-in forwards;
      transform-origin: right center;
    }
    .page-flip-in-prev {
      animation: flipInPrev 0.35s ease-out forwards;
      transform-origin: right center;
    }

    @keyframes flipOut {
      0%   { transform: rotateY(0deg); opacity: 1; }
      100% { transform: rotateY(-90deg); opacity: 0; }
    }
    @keyframes flipIn {
      0%   { transform: rotateY(90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    @keyframes flipOutPrev {
      0%   { transform: rotateY(0deg); opacity: 1; }
      100% { transform: rotateY(90deg); opacity: 0; }
    }
    @keyframes flipInPrev {
      0%   { transform: rotateY(-90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }

    /* ---- NAV BUTTONS ---- */
    .nav {
      display: flex;
      gap: 12px;
      margin: 18px 0;
      width: 100%;
      max-width: 480px;
      padding: 0 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .nav-btn:active { transform: scale(0.97); }

    .btn-prev {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #a08090;
    }

    .btn-next {
      background: linear-gradient(135deg, #cc0033, #ff2255);
      color: #fff;
      box-shadow: 0 4px 20px rgba(200,0,50,0.4);
    }

    .btn-prev:disabled {
      opacity: 0.2;
      cursor: default;
    }

    /* ---- PROGRESS BAR ---- */
    .progress-wrap {
      width: 100%;
      max-width: 480px;
      padding: 0 12px;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #cc0033, #ff2255);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ---- CTA (last page) ---- */
    .cta-section {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 0 12px 40px;
      text-align: center;
    }

    .cta-section.visible { display: block; }

    .cta-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .cta-divider::before, .cta-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(200,0,60,0.25);
    }

    .cta-divider span {
      font-size: 11px;
      color: #ff4466;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .cta-teaser {
      font-size: 15px;
      color: #c09098;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .cta-teaser strong { color: #ff8899; }

    .cta-btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(135deg, #cc0033, #ff2255);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 14px;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 32px rgba(200,0,50,0.5);
      animation: pulseCta 2s ease-in-out infinite;
      margin-bottom: 10px;
    }

    @keyframes pulseCta {
      0%, 100% { box-shadow: 0 8px 32px rgba(200,0,50,0.5); }
      50%       { box-shadow: 0 8px 50px rgba(200,0,50,0.75); }
    }

    .cta-price {
      font-size: 12px;
      color: #604050;
      margin-top: 8px;
    }

    /* Swipe hint */
    .swipe-hint {
      font-size: 11px;
      color: #402030;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <span class="topbar-title">🔥 Histórias Proibidas</span>
    <span class="topbar-badge">🔞 +18</span>
  </div>

  <!-- PAGE COUNTER -->
  <div class="page-counter">Página <span id="cur">1</span> de <span id="total">11</span></div>

  <!-- READER -->
  <div class="reader">
    <div class="page-scene">
      <img id="pageImg" src="pages/page01.jpg" alt="Página 1" />
    </div>
  </div>

  <p class="swipe-hint">👆 Deslize ou use os botões para virar</p>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 9.09%"></div>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button class="nav-btn btn-prev" id="btnPrev" onclick="changePage(-1)" disabled>← Anterior</button>
    <button class="nav-btn btn-next" id="btnNext" onclick="changePage(1)">Próxima →</button>
  </div>

  <!-- CTA (aparece na última página) -->
  <div class="cta-section" id="ctaSection">
    <div class="cta-divider"><span>e agora?</span></div>
    <p class="cta-teaser">
      Isso foi só o começo… 🔥<br/>
      <strong>A história completa tem mais de 80 páginas</strong> e você não vai querer perder o que vem depois.
    </p>
    <a
      class="cta-btn"
      href="https://pay.cakto.com.br/xbp8uv5_917950"
      onclick="fbq('track','InitiateCheckout')"
    >
      📲 HQ COMPLETA NO TELEGRAM — R$19,90
    </a>
    <p class="cta-price">🔒 Pagamento seguro · Acesso imediato</p>
  </div>

  <script>
    const TOTAL = 11;
    let current = 1;
    let animating = false;

    const img        = document.getElementById('pageImg');
    const curEl      = document.getElementById('cur');
    const btnPrev    = document.getElementById('btnPrev');
    const btnNext    = document.getElementById('btnNext');
    const progress   = document.getElementById('progressFill');
    const ctaSection = document.getElementById('ctaSection');

    function updateUI() {
      curEl.textContent = current;
      btnPrev.disabled = current === 1;
      btnNext.textContent = current === TOTAL ? '✓ Fim da prévia' : 'Próxima →';
      btnNext.disabled = current === TOTAL;
      progress.style.width = ((current / TOTAL) * 100) + '%';
      ctaSection.classList.toggle('visible', current === TOTAL);

      if (current === TOTAL) {
        fbq('track', 'AddToCart'); // reached end of preview
      }
    }

    function changePage(dir) {
      if (animating) return;
      const next = current + dir;
      if (next < 1 || next > TOTAL) return;

      animating = true;
      const outClass = dir > 0 ? 'page-flip-out'      : 'page-flip-out-prev';
      const inClass  = dir > 0 ? 'page-flip-in'       : 'page-flip-in-prev';

      img.classList.add(outClass);

      setTimeout(() => {
        current = next;
        img.src = `pages/page${String(current).padStart(2,'0')}.jpg`;
        img.classList.remove(outClass);
        img.classList.add(inClass);
        updateUI();

        setTimeout(() => {
          img.classList.remove(inClass);
          animating = false;
        }, 350);
      }, 300);
    }

    // Touch/swipe support
    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) changePage(dx < 0 ? 1 : -1);
    }, { passive: true });

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') changePage(1);
      if (e.key === 'ArrowLeft')  changePage(-1);
    });

    updateUI();
  </script>
</body>
</html>
